<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1 id="title"></h1>
    <div id="text"></div>
    <div id="output"></div>
    <script src="./for.js"></script>
    <script>
        async function getData() {
            try {
                const response = await fetch(
                    'https://subdomain.oneentry.cloud/api/content/pages/1',
                    {
                        method: 'GET',
                    },
                );
                const data = await response.json();
                // Получаем элементы по id
                const titleElem = document.getElementById('title');
                const textElem = document.getElementById('text');
                // Проверяем, что такие элементы есть и данные загружены
                if (data.localizeInfos && data.localizeInfos['en-US']) {
                    titleElem.innerHTML = data.localizeInfos['en-US'].title || 'No title';
                    textElem.innerHTML = data.localizeInfos['en-US'].content || 'No content';
                } else {
                    titleElem.innerHTML = 'No title found';
                    textElem.innerHTML = 'No content found';
                }
            } catch (error) {
                console.log(error);
                document.getElementById('output').innerText = 'Error loading data';
            }
        }

        // Запускаем функцию после загрузки DOM
        document.addEventListener('DOMContentLoaded', getData);
    </script>
</body>

</html>
